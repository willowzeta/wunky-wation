- type: entity
  id: BaseAnomAbstraction
  name: anomalous abstraction
  description: An impossible object formed from fluctuations in the underlying bluespace field matrix.
  components: # why not parent BaseAnomaly you ask? because blaming other people when it inevitably goes wrong is an easy out
  - type: BaseAnomaly
  - type: AnomalousAbstraction
  - type: AmbientSound
    range: 5
    volume: -5
    sound:
      path: /Audio/Ambience/anomaly_drone.ogg
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    bodyStatus: InAir
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Sprite
    noRot: true
    drawdepth: Effects #it needs to draw over stuff.
    sprite: Structures/Specific/anomaly.rsi
    state: anom4
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
  - type: Appearance
  - type: AnimationPlayer
  - type: GuideHelp
    guides:
    - AnomalousResearch
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/teleport_arrival.ogg
  - type: DamageOnInteract
    damage:
      types:
        Radiation: 10
    popupText: anomaly-component-contact-damage
  - type: DamageOnAttacked
    damage:
      types:
        Radiation: 10

- type: entity
  id: RandomAnomAbstractionSpawner
  name: random anomalous abstraction spawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Specific/anomaly.rsi
      state: anom1
  - type: RandomSpawner
    chance: 1
    prototypes:
    - BaseAnomAbstraction
