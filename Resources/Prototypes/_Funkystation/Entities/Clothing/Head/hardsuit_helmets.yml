- type: entity
  parent: ClothingHeadHelmetHardsuitSecurity
  id: ClothingHeadHelmetHardsuitMusician
  name: musician hardsuit helmet
  description: A musician hardsuit helmet.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Hardsuits/musician.rsi
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableLightVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
        shader: unshaded
  - type: Clothing
    sprite: _Funkystation/Clothing/Head/Hardsuits/musician.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: RgbLightController
    layers: [ 1 ]

# Helldivers, Funky
- type: entity
  parent: ClothingHeadHelmetHardsuitGoliath
  id: ClothingHeadHelmetHelldiver
  name: salvage NT-01 tactical helmet
  description: This armor is the NanoTrasen standard issue, made from the same titanium alloy as the Goliath hull.
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _Goobstation/Clothing/Head/Helmets/helldiver.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Head/Helmets/helldiver.rsi
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide

# Pilot Voidsuit - Civilian
- type: entity
  parent: ClothingHeadHardsuitBase
  id: ClothingHeadHelmetHardsuitPilot
  name: pilot voidsuit helmet
  description: Resist the urge to Akira slide into docking position.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Hardsuits/pilot-civvie.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Head/Hardsuits/pilot-civvie.rsi
  - type: Armor
    modifiers:
      coefficients: # hopefully this nullifies the base armor values
    clothingVisuals:
      head:
      - state: equipped-HELMET

# Pilot Voidsuit - Security
- type: entity
  parent: ClothingHeadHardsuitBase
  id: ClothingHeadHelmetHardsuitPilotSecurity
  name: security pilot voidsuit helmet
  description: Wear this to hide your tears of never getting to to build shuttle guns.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Hardsuits/pilot-security.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Head/Hardsuits/pilot-security.rsi
  - type: Armor
    modifiers:
      coefficients: # copied from default sec helmet
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
    clothingVisuals:
      head:
      - state: equipped-HELMET
