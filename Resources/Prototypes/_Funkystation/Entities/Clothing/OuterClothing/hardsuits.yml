- type: entity
  parent: BaseItem
  id: ClothingOuterHardsuitMusicianConstruction
  name: musician hardsuit shell
  description: A custom-made incomplete musician hardsuit.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Hardsuits/musician.rsi
    state: icon-incomplete
  - type: Construction
    graph: MusicianHardsuit
    node: addInstruments

- type: entity
  parent: ClothingOuterHardsuitClown
  id: ClothingOuterHardsuitMusician
  name: musician hardsuit
  description: A custom-made musician hardsuit.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Hardsuits/musician.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Hardsuits/musician.rsi
  - type: Construction
    graph: MusicianHardsuit
    node: musicianHardsuit
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitMusician
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
  - type: ActivatableUI
    blockSpectators: true
    singleUser: true
    requiresComplex: true
    verbOnly: true
    verbText: verb-instrument-openui
    key: enum.InstrumentUiKey.Key
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface

# Helldiver, Funkified
- type: entity
  parent: ClothingOuterHardsuitGoliath
  id: ClothingOuterArmorHelldiver
  name: salvage NT-01 tactical hardsuit
  description: This armor is the NanoTrasen standard issue, made from the same titanium alloy as the Goliath hull.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Armor/helldiver.rsi
    layers:
    - state: icon
    - state: light-overlay
      visible: false
      shader: unshaded
  - type: Clothing
    sprite: _Goobstation/Clothing/OuterClothing/Armor/helldiver.rsi
  - type: PointLight
    enabled: false
    color: "#e5af38"
    radius: 5
    energy: 2
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHelldiver

# Pilot Voidsuit - Civilian - available in the CargoDrobe
- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitPilot
  name: pilot voidsuit
  description: A light, flexible and well insulated hardsuit designed for civilian shuttle pilots. Made to resemble a pre-TSF Earth pilot's outfit.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Hardsuits/pilot-civvie.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Hardsuits/pilot-civvie.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitPilot
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.95
        Heat: 0.5
        Cold: 0.5
        Radiation: 0.8
  - type: ClothingSpeedModifier
    sprintModifier: 0.9
    walkModifier: 1

# Pilot Voidsuit - Security - Appears in security suit storage, officers should have a choice and spares are always nice
- type: entity
  parent: [ClothingOuterHardsuitPilot, BaseSecurityContraband]
  id: ClothingOuterHardsuitPilotSecurity
  name: security pilot voidsuit
  description: A more combat-ready take on the standard civilian pilot suit. Offers a small amount of armor in exchange for a minor weight increase.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Hardsuits/pilot-security.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Hardsuits/pilot-security.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitPilotSecurity
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.85
        Piercing: 0.9
        Heat: 0.5
        Cold: 0.5
        Radiation: 0.8
  - type: ClothingSpeedModifier
    sprintModifier: 0.85
    walkModifier: 1
