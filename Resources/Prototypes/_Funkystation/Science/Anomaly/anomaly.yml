- type: entity
  id: AnomalyDetector
  parent: BaseMachinePowered
  name: anomaly detector
  description: An important safety feature, or a herald of the apocalypse, depending on who you ask.
  components:
  - type: Sprite
    sprite: Structures/Machines/rndpointsource.rsi
    layers:
    - state: rndpointsource-off
    - state: rndpointsource
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ActiveRadio
    channels:
    - Science
  - type: AnomalyDetector

- type: entity
  id: AnomalyContainer
  parent: BaseItem
  name: anomaly containment vessel
  description: A container for a stabilized anomaly or similar object. If the container is full, you should probably get a move on.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Science/Anomaly/container.rsi
    layers:
    - state: base
    - state: empty
      shader: unshaded
      map: [ "enum.AnomContainerVisualLayers.Empty" ]
    - state: full
      shader: unshaded
    - map: [ "enum.AnomContainerVisualLayers.Full" ]
  - type: AnomalyContainer
  - type: ContainerContainer
    container:
      anomalycontainer: !type:ContainerSlot
  - type: ItemSlots
    slots:
      anomalyCan:
        name: anomalyCan

- type: entity
  id: AnomalyResearchVessel
  parent: BaseMachinePowered
  name: anomaly research vessel
  description: Put reality-bending object in, get valuable data out.
  components:
  - type: Sprite
    sprite: Structures/Machines/Anomaly/anomaly_vessel.rsi
    layers:
    - state: base
    - state: panel




